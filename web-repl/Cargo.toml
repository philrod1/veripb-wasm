[package]
name = "web-repl"
version = "0.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
serde_json = "1"
tempfile = "3"
crossterm = "0.29"
veripb-repl = { path = "../work/veripb-repl-tui" }

# The TUI tree (for its completion and themes) builds crossterm; use the
# WASI backend from patches/crossterm/.
[patch.crates-io]
crossterm = { path = "../work/crossterm" }
