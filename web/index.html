<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>veripb-repl web</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>veripb-repl</h1>
  <label>mode <select id="mode" aria-label="Interface mode"></select></label>
  <span class="about">veripb in WebAssembly · files stay in this tab</span>
  <span id="status"></span>
</header>
<main id="mode-root"></main>
<aside>
  <h2>Files</h2>
  <button id="demos" type="button">Load demo files</button>
  <label class="button" for="upload">Upload .opb / .pbp…</label>
  <input id="upload" type="file" multiple accept=".opb,.pbp,.txt">
  <ul id="files"></ul>
</aside>
<script type="module" src="shell.js"></script>
</body>
</html>
