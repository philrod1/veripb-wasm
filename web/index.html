<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>veripb-repl web</title>
<style>
  :root {
    --bg: #fbfbfa; --fg: #1f2328; --muted: #6a737d; --panel: #f0f0ee;
    --border: #d6d6d2; --accent: #2f6feb; --echo: #116329; --error: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c; --fg: #e6e6e3; --muted: #8b949e; --panel: #1f2227;
      --border: #30343b; --accent: #6ea8fe; --echo: #7ee2a8; --error: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: grid; grid-template-columns: 1fr 16rem; grid-template-rows: auto 1fr;
    grid-template-areas: "head head" "term files";
  }
  header { grid-area: head; padding: 0.5rem 1rem; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 1rem; margin: 0; display: inline; }
  header span { color: var(--muted); margin-left: 0.75rem; }
  #status { float: right; }
  #term { grid-area: term; display: flex; flex-direction: column; min-height: 0; }
  #out { flex: 1; margin: 0; padding: 0.75rem 1rem; overflow: auto; white-space: pre-wrap; word-break: break-word; }
  #out .echo { color: var(--echo); }
  #out .error { color: var(--error); }
  #out .note { color: var(--muted); }
  form { display: flex; border-top: 1px solid var(--border); padding: 0.5rem 1rem; gap: 0.25rem; }
  #prompt { color: var(--echo); white-space: pre; }
  #in { flex: 1; font: inherit; color: inherit; background: transparent; border: none; outline: none; }
  aside { grid-area: files; border-left: 1px solid var(--border); background: var(--panel); padding: 0.75rem; overflow: auto; }
  aside h2 { font-size: 0.85rem; margin: 0 0 0.5rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  aside button, aside label.button {
    display: block; width: 100%; margin-bottom: 0.5rem; padding: 0.35rem 0.5rem; font: inherit;
    color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; text-align: center;
  }
  aside input[type=file] { display: none; }
  #files { list-style: none; padding: 0; margin: 0.75rem 0 0; }
  #files li { display: flex; justify-content: space-between; gap: 0.5rem; padding: 0.15rem 0; }
  #files a { color: var(--accent); text-decoration: none; overflow: hidden; text-overflow: ellipsis; }
  #files span { color: var(--muted); }
  @media (max-width: 700px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; grid-template-areas: "head" "term" "files"; }
    aside { border-left: none; border-top: 1px solid var(--border); max-height: 30vh; }
  }
</style>
</head>
<body>
<header><h1>veripb-repl</h1><span>plain mode · veripb in WebAssembly · files stay in this tab</span><span id="status"></span></header>
<main id="term">
  <pre id="out"><span class="note">Loading WebAssembly modules…</span>
</pre>
  <form id="form" autocomplete="off">
    <span id="prompt"></span><input id="in" spellcheck="false" disabled aria-label="REPL input">
  </form>
</main>
<aside>
  <h2>Files</h2>
  <button id="demos" type="button" disabled>Load demo files</button>
  <label class="button" for="upload">Upload .opb / .pbp…</label>
  <input id="upload" type="file" multiple accept=".opb,.pbp,.txt">
  <ul id="files"></ul>
</aside>
<script>
const PROMPTS = ["pbp> ", "edit> ", "opb> ", "debug> "];
const MODE_QUIT = 4;
const out = document.getElementById("out");
const input = document.getElementById("in");
const prompt = document.getElementById("prompt");
const fileList = document.getElementById("files");
const demosButton = document.getElementById("demos");
const worker = new Worker("worker.js", { type: "module" });

let mode = null;
const history = [];
let historyPos = 0;

const statusText = document.getElementById("status");
const isError = (line) => line.startsWith("Error") || line.startsWith("[host]");

// Appends lines in one DOM update. `cls` styles every line; otherwise error
// lines get the "error" style. Layout is read once per call.
// The "Loading…" note is removed by the first output or prompt.
let loading = true;
function clearLoading() {
  if (loading) out.textContent = "";
  loading = false;
}

function append(lines, cls) {
  clearLoading();
  if (typeof lines === "string") lines = [lines];
  const atBottom = out.scrollHeight - out.scrollTop - out.clientHeight < 40;
  const fragment = document.createDocumentFragment();
  let plain = "";
  const flushPlain = () => {
    if (plain) fragment.appendChild(document.createTextNode(plain));
    plain = "";
  };
  for (const line of lines) {
    const style = cls ?? (isError(line) ? "error" : null);
    if (!style) { plain += line + "\n"; continue; }
    flushPlain();
    fragment.appendChild(Object.assign(document.createElement("span"), { className: style, textContent: line + "\n" }));
  }
  flushPlain();
  out.appendChild(fragment);
  if (atBottom) out.scrollTop = out.scrollHeight;
}

function setReady(ready) {
  input.disabled = !ready;
  if (ready) input.focus();
}

worker.onmessage = ({ data: message }) => {
  switch (message.type) {
    case "out":
      append(message.lines);
      break;
    case "mode":
      if (mode === null) { clearLoading(); demosButton.disabled = false; }
      mode = message.mode;
      if (message.veripbRuns !== undefined && message.ms > 0) {
        statusText.textContent = `${message.ms.toFixed(0)} ms · ${message.veripbRuns} veripb run${message.veripbRuns === 1 ? "" : "s"}`;
      }
      if (mode === MODE_QUIT || mode < 0) {
        append(mode === MODE_QUIT ? "Session ended. Reload the page to start again." : "Startup failed.", "note");
        prompt.textContent = "";
        setReady(false);
      } else {
        prompt.textContent = PROMPTS[mode];
        setReady(true);
      }
      break;
    case "files":
      renderFiles(message.files);
      break;
    case "file":
      if (message.data) download(message.name, message.data);
      break;
    case "fatal":
      append(`Internal error: ${message.text}\nReload the page to start again.`, "error");
      setReady(false);
      break;
  }
};

document.getElementById("form").addEventListener("submit", (event) => {
  event.preventDefault();
  if (input.disabled) return;
  const text = input.value;
  append(PROMPTS[mode] + text, "echo");
  if (text.trim() && history[history.length - 1] !== text) history.push(text);
  historyPos = history.length;
  input.value = "";
  setReady(false);
  worker.postMessage({ type: "line", text });
});

input.addEventListener("keydown", (event) => {
  if (event.key !== "ArrowUp" && event.key !== "ArrowDown") return;
  event.preventDefault();
  historyPos = Math.max(0, Math.min(history.length, historyPos + (event.key === "ArrowUp" ? -1 : 1)));
  input.value = history[historyPos] ?? "";
});

function renderFiles(files) {
  fileList.replaceChildren(...files.map(({ name, size }) => {
    const item = document.createElement("li");
    const link = Object.assign(document.createElement("a"), { href: "#", textContent: name, title: `Download ${name}` });
    link.addEventListener("click", (event) => { event.preventDefault(); worker.postMessage({ type: "get", name }); });
    item.append(link, Object.assign(document.createElement("span"), { textContent: `${size} B` }));
    return item;
  }));
}

function download(name, data) {
  const url = URL.createObjectURL(new Blob([data], { type: "text/plain" }));
  Object.assign(document.createElement("a"), { href: url, download: name }).click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function putFile(name, buffer) {
  worker.postMessage({ type: "put", name, data: buffer }, [buffer]);
}

document.getElementById("upload").addEventListener("change", async (event) => {
  for (const file of event.target.files) putFile(file.name, await file.arrayBuffer());
  event.target.value = "";
  input.focus();
});

demosButton.addEventListener("click", async () => {
  const names = await (await fetch("pkg/demos/index.json")).json();
  for (const name of names) putFile(name, await (await fetch(`pkg/demos/${name}`)).arrayBuffer());
  append(`Loaded demo files: ${names.join(", ")}. Try :instance two-of-three`, "note");
  input.focus();
});

out.addEventListener("click", () => { if (!getSelection().toString()) input.focus(); });
</script>
</body>
</html>
